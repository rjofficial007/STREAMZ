name: streamz
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.5+1
  # Networking & Server
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.6.0
  network_info_plus: ^8.1.0
  device_info_plus: ^13.1.0
  # Media & Storage
  photo_manager: ^3.9.0
  permission_handler: ^12.0.1
  # UI
  google_fonts: ^8.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  url_launcher: ^6.3.2
  wakelock_plus: ^1.6.0
  flutter_background: ^1.3.1
  on_audio_query: ^2.9.0
  phosphor_flutter: ^2.1.0

  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

  video_thumbnail: ^0.5.6
  cached_network_image: ^3.4.1

  device_preview: ^1.3.1
  get_it: ^9.2.1
  convert: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/arrow_left_icon.png
    - assets/images/audio_icon.png
    - assets/images/download_icon.png
    - assets/images/fast_forward_icon.png
    - assets/images/file_icon.png
    - assets/images/folder_icon.png
    - assets/images/gear_icon.png
    - assets/images/image_icon.png
    - assets/images/pause_icon.png
    - assets/images/play_icon.png
    - assets/images/rewind_icon.png
    - assets/images/speaker_high.png
    - assets/images/video_icon.png
    - assets/images/x_icon.png
    - assets/images/audio_thumbnail.png
    - assets/images/photo_thumbnail.png
    - assets/images/video_thumbnail.png
    - assets/images/web_app_bg_1.jpg
    - assets/images/web_app_bg_2.jpg
    - assets/images/web_app_bg_3.jpg
    - assets/images/web_app_bg_4.jpg

