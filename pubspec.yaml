name: streamz
description: "STREAMZ — Cross-platform local media broadcasting system."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.5+1
  go_router: ^18.1.2

  # Networking & Server
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  http: ^1.6.0
  bonsoir: ^7.1.6
  device_info_plus: ^13.3.0

  # Media & Storage
  photo_manager: ^3.12.0
  permission_handler: ^13.0.2
  on_audio_query: ^2.9.0
  get_thumbnail_video: ^0.7.3

  # UI
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.8.2
  flutter_background: ^1.3.1
  lucide_icons_flutter: ^4.0.1
  window_manager: ^0.5.2
  cached_network_image: ^4.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  liquid_glass_easy: ^5.1.0
  flutter_inappwebview: ^6.1.5

  # WebSockets
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

  # Persistence
  shared_preferences: ^2.5.6

  # DI
  get_it: ^9.3.0

  # Utilities
  logger: ^2.8.0
  intl: ^0.20.3
  crypto: ^3.0.8
  convert: ^3.1.2
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Variable.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Variable.ttf
